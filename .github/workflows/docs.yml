# Publishes the Compodoc documentation of `develop` to GitHub Pages, together with the
# coverage report of the unit tests.
#
# Deliberately a GitHub Actions workflow and not a GitLab job: the GitLab pipeline
# suppresses push pipelines on branches and competes for a single runner.
# The output -- 51 MB of documentation and 42 MB of coverage report -- is deployed as a
# Pages artifact, not committed to a /docs folder, so it never enters the repository history.
#
# It runs after the merge, so nothing here is on the waiting time of a pull request: the
# pipeline that gates a merge is the GitLab one, and it stays as it is. For the same reason
# the tests here are not a gate -- a red one must not keep the documentation from being
# published. The site then shows no coverage until the next green run, which is honest: a
# report from a failed run would be worse than none.
name: Documentation

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a running deployment finish: cancelling `deploy-pages` mid-flight can leave the
  # Pages deployment abandoned, and two pushes to `develop` within minutes are common here.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Compodoc reads the sources, so no build step is needed; the unit tests run in browser
      # mode and bring their own Chromium, which --ignore-scripts leaves to the explicit install
      # below (and spares the Cypress binary, which nothing here uses).
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run docs
      - id: coverage
        continue-on-error: true
        run: npm run test:coverage
      - name: Put the coverage report next to the documentation
        if: steps.coverage.outcome == 'success'
        run: |
          mkdir -p dist/docs/coverage
          cp -r coverage/. dist/docs/coverage/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs
      - id: deployment
        uses: actions/deploy-pages@v5
