@if (this.elementModel.showResetIcon) {
  <button mat-stroked-button class="reset-button"
          (click)="reset()">
    <mat-icon class="reset-icon">autorenew</mat-icon>
    {{ 'geometry_reset' | translate }}
  </button>
}
<div [id]="elementModel.id" class="geogebra-applet"></div>
@if (isGeoGebraLoaded) {
  <aspect-spinner [isLoaded]="isLoaded"
                  (timeOut)="throwError('GEOGEBRA_TIMEOUT', timeoutMsg)">
  </aspect-spinner>
}
