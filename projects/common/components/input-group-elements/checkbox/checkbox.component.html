<ng-container *ngIf="!tableMode">
  <div class="mat-form-field"
       [style.width.%]="100"
       [style.height.%]="100"
       [style.background-color]="elementModel.styling.backgroundColor">
    <mat-checkbox #checkbox class="example-margin"
                  [formControl]="elementFormControl"
                  [class.image]="elementModel.imgSrc"
                  [checked]="$any(elementModel.value)"
                  [class.strike]="elementModel.crossOutChecked && elementFormControl.value"
                  [style.color]="elementModel.styling.fontColor"
                  [style.font-size.px]="elementModel.styling.fontSize"
                  [style.font-weight]="elementModel.styling.bold ? 'bold' : ''"
                  [style.font-style]="elementModel.styling.italic ? 'italic' : ''"
                  [style.text-decoration]="elementModel.styling.underline ? 'underline' : ''"
                  (click)="elementModel.readOnly ? $event.preventDefault() : null">
      @if (elementModel.imgSrc) {
        <img [src]="elementModel.imgSrc" alt="Bildplatzhalter">
      } @else {
        <div [innerHTML]="elementModel.label | safeResourceHTML"></div>
      }
    </mat-checkbox>
    <mat-error *ngIf="elementFormControl.errors && elementFormControl.touched"
               class="error-message">
      {{elementFormControl.errors | errorTransform: elementModel}}
    </mat-error>
  </div>
</ng-container>
<ng-container *ngIf="tableMode">
  <div class="svg-checkbox"
       [class.read-only] = "elementModel.readOnly"
       [class.errors]="elementFormControl.errors && elementFormControl.touched"
       (click)="elementFormControl.markAsTouched(); elementFormControl.setValue(!elementFormControl.value)">
    <!-- Without parentForm (editor mode) the control is never updated, so mirror the model value -->
    <svg class="svg-checkbox-cross"
         [style.opacity]="(parentForm ? elementFormControl.value : elementModel.value) ? 1 : 0"
         viewBox='0 0 100 100'>
      <path d='M1 0 L0 1 L99 100 L100 99' fill='black' stroke="black" stroke-width="2" />
      <path d='M0 99 L99 0 L100 1 L1 100' fill='black' stroke="black" stroke-width="1" />
    </svg>
  </div>
  <aspect-cloze-child-error-message *ngIf="elementFormControl.errors && elementFormControl.touched"
                                    [elementModel]="elementModel"
                                    [elementFormControl]="elementFormControl">
  </aspect-cloze-child-error-message>
</ng-container>
