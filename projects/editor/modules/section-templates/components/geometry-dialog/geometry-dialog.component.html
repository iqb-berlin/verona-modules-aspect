<h2 mat-dialog-title>{{ 'sectionTemplates.geometryTitle' | translate }}</h2>
<div mat-dialog-content>
  <h3>{{ 'text' | translate }}</h3>
  <aspect-rich-text-editor [(content)]="text"
                           [placeholder]="'sectionTemplates.questionPlaceholder' | translate">
  </aspect-rich-text-editor>

  <h3>{{ 'sectionTemplates.geometryFile' | translate }}</h3>
  <mat-form-field matTooltip="{{'propertiesPanel.appDefinition' | translate }}"
                  appearance="fill" [style.align-self]="'flex-start'" [style.width.%]="40">
    <mat-label>{{ 'propertiesPanel.appDefinition' | translate }}</mat-label>
    <input matInput disabled
           [value]="(geometryAppDefinition ? 'sectionTemplates.definitionAvailable' :
                                             'sectionTemplates.noDefinitionAvailable') | translate">
    <button mat-icon-button matSuffix (click)="changeSrc()">
      <mat-icon>edit</mat-icon>
    </button>
  </mat-form-field>

  <h3>{{ 'sectionTemplates.help' | translate }}</h3>
  <mat-checkbox [(ngModel)]="showHelper">
    {{ 'sectionTemplates.addGeometryHelperImage' | translate }}
  </mat-checkbox>

</div>
<div mat-dialog-actions>
  <button mat-button [disabled]="geometryAppDefinition == undefined"
          [mat-dialog-close]="{ text, geometryAppDefinition, geometryFileName, showHelper }">
    {{'confirm' | translate }}
  </button>
  <button mat-button mat-dialog-close>{{'cancel' | translate }}</button>
</div>
