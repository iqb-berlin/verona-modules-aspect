<h2 mat-dialog-title class="message-title">
  @if (data.refs?.length) {
    <mat-icon class="message-icon-warning">warning</mat-icon>
  }
  <span>{{ data.text }}</span>
</h2>
<mat-dialog-content>
  @if (data.elementList && data.elementList.length > 0) {
    <aspect-element-list [elements]="data.elementList"></aspect-element-list>
  }
  @if (data.refs && data.refs.length > 0) {
    <aspect-reference-list [refs]="data.refs" [navigable]="true"
                           (goToElement)="goToElement($event)" (goToSection)="goToSection($event)">
    </aspect-reference-list>
    <p class="reference-removal-hint">{{ 'referenceRemoval.removedWith' | translate }}</p>
    <p class="reference-removal-hint">{{ 'referenceRemoval.goToCancels' | translate }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <!-- Focused first: Enter must neither delete nor go somewhere else. -->
  <button mat-button mat-dialog-close cdkFocusInitial>{{ 'cancel' | translate }}</button>
  @if (data.refs?.length) {
    <button mat-flat-button color="warn" class="confirm-delete" [mat-dialog-close]="true">
      {{ 'referenceRemoval.delete' | translate }}
    </button>
  } @else {
    <button mat-button class="confirm-delete" [mat-dialog-close]="true">{{ 'delete' | translate }}</button>
  }
</mat-dialog-actions>
