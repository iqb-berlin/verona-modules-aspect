<h2 mat-dialog-title class="message-title">
  <mat-icon class="message-icon-warning">warning</mat-icon>
  <span>{{ 'referenceRemoval.changeTextTitle' | translate }}</span>
</h2>
<mat-dialog-content>
  <aspect-reference-list [refs]="data.refs" [navigable]="true"
                         (goToElement)="goToElement($event)" (goToSection)="goToSection($event)">
  </aspect-reference-list>
  <p class="reference-removal-hint">{{ 'referenceRemoval.removedWith' | translate }}</p>
  <p class="reference-removal-hint">{{ 'referenceRemoval.goToCancelsChange' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <!-- Focused first: Enter must neither change the text nor go somewhere else. -->
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>{{ 'cancel' | translate }}</button>
  <button mat-flat-button color="warn" class="confirm-change" [mat-dialog-close]="true">
    {{ 'referenceRemoval.changeText' | translate }}
  </button>
</mat-dialog-actions>
