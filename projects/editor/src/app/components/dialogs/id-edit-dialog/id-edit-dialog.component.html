<mat-dialog-content>
    <h2 mat-dialog-title>{{ 'idEditDialog.title' | translate }}</h2>
    <mat-form-field class="example-full-width">
      <mat-label>{{'propertiesPanel.id' | translate }}</mat-label>
      <input matInput required [formControl]="aliasControl">
      @if (aliasControl.invalid) {
        <mat-error>
          @if (aliasControl.hasError('alias')) {
            <span>{{ aliasControl.getError('alias') | translate }}</span>
          } @else {
            <span>{{ 'inputInvalid' | translate }}</span>
          }
        </mat-error>
      }
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button [disabled]="aliasControl.invalid" [mat-dialog-close]="aliasControl.value">
    {{'save' | translate }}
  </button>
  <button mat-button mat-dialog-close>{{'cancel' | translate }}</button>
</mat-dialog-actions>
