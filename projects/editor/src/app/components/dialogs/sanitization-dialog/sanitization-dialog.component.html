<h1 mat-dialog-title class="message-title">
  <mat-icon class="message-icon-warning">warning</mat-icon>
  <span>{{ 'sanitization.title' | translate }}</span>
</h1>
<p mat-dialog-content>{{ 'sanitization.text' | translate }}</p>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="true">{{ 'sanitization.confirm' | translate }}</button>
</mat-dialog-actions>
