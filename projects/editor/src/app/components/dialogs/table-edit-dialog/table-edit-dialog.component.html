<div mat-dialog-title>{{ 'tableEditDialog.title' | translate }}</div>
<mat-dialog-content>
  <aspect-table [elementModel]="newTable" [editorMode]="true" [allowElementEditing]="true"
                [contentRowHeight]="'250px'"
                [elementNames]="'toolbox' | translate"
                (elementAdded)="addElement($event)"
                (elementRemoved)="removeElement($event)"
                (headerCellEditRequested)="editHeaderCell($event)"></aspect-table>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="save()">
    {{'save' | translate }}
  </button>
  <button mat-button mat-dialog-close>{{'cancel' | translate }}</button>
</mat-dialog-actions>
