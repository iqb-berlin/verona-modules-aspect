<mat-list>
  @for (element of elements; track element) {
    <mat-list-item class="element-list-item">
      <mat-icon matListItemIcon>
        {{ $any(element.constructor).icon }}
      </mat-icon>
      <div matListItemTitle>
        {{ $any(element.constructor).title }}: <i>{{ element.alias }}</i>
      </div>
      @if (navigable) {
        <button mat-stroked-button matListItemMeta class="go-to-element" (click)="goToElement.emit(element)">
          {{ 'unitHints.goToElement' | translate }}
        </button>
      }
    </mat-list-item>
  }
</mat-list>
