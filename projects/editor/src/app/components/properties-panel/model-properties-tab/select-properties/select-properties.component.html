<aspect-merged-checkbox *ngIf="unitService.expertMode && combinedProperties.strikeOtherOptions !== undefined"
                        [value]="$any(combinedProperties.strikeOtherOptions)"
                        (valueChange)="updateModel.emit({ property: 'strikeOtherOptions', value: $event })">
  {{'propertiesPanel.strikeOtherOptions' | translate }}
</aspect-merged-checkbox>
<aspect-merged-checkbox *ngIf="combinedProperties.strikeSelectedOption !== undefined"
                        [matTooltip]="'Hierdurch wird die Auswahlfarbe ignoriert und der Hintergrund transparent dargestellt'"
                        [value]="$any(combinedProperties.strikeSelectedOption)"
                        (valueChange)="updateModel.emit({ property: 'strikeSelectedOption', value: $event })">
  {{'propertiesPanel.strikeSelectedOption' | translate }}
</aspect-merged-checkbox>
<aspect-merged-checkbox *ngIf="combinedProperties.allowUnset !== undefined"
                        [value]="$any(combinedProperties.allowUnset)"
                        (valueChange)="updateModel.emit({ property: 'allowUnset', value: $event })">
  {{'propertiesPanel.allowUnset' | translate }}
</aspect-merged-checkbox>

<!-- Not an aspect-merged-checkbox: itemsPerRow is a number, and null means "no limit" here
     rather than "the selected elements disagree". -->
<mat-checkbox *ngIf="combinedProperties.itemsPerRow !== undefined"
              (change)="setItemsPerRow($event.checked)"
              [checked]="!!$any(combinedProperties.itemsPerRow)">
  {{'limitItemPerRow' | translate}}
</mat-checkbox>

<mat-form-field *ngIf="combinedProperties.itemsPerRow !== undefined"
                appearance="fill" class="mdInput textsingleline">
  <mat-label>{{'itemsPerRow' | translate }}</mat-label>
  <input matInput type="number" [min]="1" [pattern]="'[1-9]'" #itemsPerRow="ngModel" required
         [disabled]="combinedProperties.itemsPerRow === null"
         [ngModel]="$any(combinedProperties.itemsPerRow)"
         (input)="itemsPerRow.valid &&
                  updateModel.emit({ property: 'itemsPerRow', value: $any($event.target).value })">
  <mat-error *ngIf="itemsPerRow.errors?.['pattern']">
    {{'numberGreater0' | translate}}
  </mat-error>
</mat-form-field>
