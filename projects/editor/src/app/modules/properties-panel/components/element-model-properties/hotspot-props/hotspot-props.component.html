<!--`!= null`: a selection whose hotspots differ merges them to null, and then there is nothing to
    add to - the add button pushed into null, and one added hotspot would replace every list (#1739).-->
@if (combinedProperties.value != null) {
  <fieldset class="fx-column-start-stretch">
    <legend>{{'propertiesPanel.hotspots' | translate }}</legend>
    <button [style.align-self]="'center'" mat-mini-fab matSuffix color="primary" [style.bottom.px]="3"
            (click)="addHotspot()">
      <mat-icon>add</mat-icon>
    </button>

    <div class="drop-list" cdkDropList [cdkDropListData]="combinedProperties.value"
         (cdkDropListDropped)="moveHotspot($event)">
      @for (item of combinedProperties.value; track $index; let i = $index) {
        <div cdkDrag class="option-draggable fx-row-start-stretch">
          <div class="fx-flex" [style.align-self]="'center'">{{'hotspot.'+item.shape | translate}}</div>
          <button mat-icon-button color="primary"
                  (click)="editHotspot(i)">
            <mat-icon>build</mat-icon>
          </button>
          <button mat-icon-button color="primary"
                  (click)="removeHotspot(i)">
            <mat-icon>clear</mat-icon>
          </button>
        </div>
      }
    </div>
  </fieldset>
}
