<aspect-merged-checkbox [value]="combinedProperties.enableModeSwitch"
                        (valueChange)="updateModel.emit({ property: 'enableModeSwitch', value: $event })">
  {{'propertiesPanel.enableModeSwitch' | translate }}
</aspect-merged-checkbox>
<aspect-merged-checkbox [value]="combinedProperties.multiline"
                        [disabled]="!combinedProperties.enableModeSwitch"
                        (valueChange)="updateModel.emit({ property: 'multiline', value: $event })">
  {{'propertiesPanel.multiline' | translate }}
</aspect-merged-checkbox>
