<mat-form-field *ngIf="combinedProperties.type === 'text-area'"
                class="wide-form-field" appearance="fill">
  <mat-label>{{'preset' | translate }}</mat-label>
  <textarea #valueField matInput type="text"
            [value]="$any(combinedProperties.value)"
            (input)="updateModel.emit({ property: 'value', value: valueField.value })">
        </textarea>
</mat-form-field>

<mat-form-field *ngIf="combinedProperties.type === 'text-field' || combinedProperties.type === 'text-field-simple'"
                class="wide-form-field" appearance="fill">
  <mat-label>{{'preset' | translate }}</mat-label>
  <input #valueField2 matInput type="text" [value]="$any(combinedProperties.value)"
         (input)="updateModel.emit({property: 'value', value: valueField2.value })">
</mat-form-field>

<!--dropdown, radio-button-group and the like. `!= null` rather than `!== undefined`: a selection
    whose option lists disagree merges to null, and then there are no options to pick a preset from -
    the trigger below would index into null on every change detection cycle. `rows === undefined`
    excludes the likert, which has options but no single preset.-->
@if (combinedProperties.options != null && combinedProperties.rows === undefined) {
  <mat-form-field appearance="fill" class="wide-form-field">
    <mat-label>{{'preset' | translate }}</mat-label>
    <mat-select [value]="combinedProperties.value"
                (selectionChange)="updateModel.emit({ property: 'value', value: $event.value })">
      <mat-select-trigger [innerHTML]="combinedProperties.options | presetOptionText:combinedProperties.value">
      </mat-select-trigger>
      <mat-option [value]="null">{{'propertiesPanel.undefined' | translate }}</mat-option>
      @for (option of combinedProperties.options; track $index) {
        <mat-option [value]="$index">
          <div [innerHTML]="option.text + ' (Index: ' + $index + ')' | safeResourceHTML"></div>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
}

<ng-container *ngIf="combinedProperties.type === 'math-field'">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <mat-label>{{'preset' | translate }}</mat-label>
    <button mat-icon-button (click)="showLatexEditor = !showLatexEditor"
            [matTooltip]="(showLatexEditor ? 'propertiesPanel.showFormula' : 'propertiesPanel.showLatex') | translate">
      <mat-icon>{{ showLatexEditor ? 'functions' : 'code' }}</mat-icon>
    </button>
  </div>

  <aspect-math-input *ngIf="!showLatexEditor"
                     [value]="$any(combinedProperties.value)"
                     [enableModeSwitch]="$any(combinedProperties.enableModeSwitch)"
                     [mathKeyboardPresets]="$any(combinedProperties.mathKeyboardPresets)"
                     [placeholder]="'propertiesPanel.formulaPlaceholder' | translate"
                     (valueChange)="updateModel.emit({property: 'value', value: $event })">
  </aspect-math-input>

  <mat-form-field *ngIf="showLatexEditor" class="wide-form-field" appearance="fill">
    <input #valueField3 matInput [value]="$any(combinedProperties.value)"
           [placeholder]="'propertiesPanel.latexPlaceholder' | translate"
           (input)="updateModel.emit({property: 'value', value: valueField3.value })">
  </mat-form-field>
</ng-container>
